<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잭슨사무실</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #f4f0e8;
    --bg-soft: #ece5d6;
    --ink: #26221d;
    --ink-soft: #6b6255;
    --line: #ddd3bf;
    --card: #fdfbf6;
    --accent: #a86a2a;
    --accent-ink: #ffffff;
    --shadow: rgba(38, 34, 29, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1815;
      --bg-soft: #221e19;
      --ink: #ece5d6;
      --ink-soft: #a89a85;
      --line: #38322a;
      --card: #24201b;
      --accent: #d9a355;
      --accent-ink: #221a0d;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1815;
    --bg-soft: #221e19;
    --ink: #ece5d6;
    --ink-soft: #a89a85;
    --line: #38322a;
    --card: #24201b;
    --accent: #d9a355;
    --accent-ink: #221a0d;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .plate {
    width: 100%;
    max-width: 720px;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: clamp(2.1rem, 6vw, 3rem);
    margin: 0;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .header .tag {
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (max-width: 480px) {
    .links { grid-template-columns: 1fr; }
  }

  .link-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 20px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 1px 2px var(--shadow);
    transition: border-left-width 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    border-left-width: 6px;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }

  .link-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .link-text .name {
    font-weight: 700;
    font-size: 1.05rem;
  }

  .link-text .desc {
    font-size: 0.78rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .archive {
    margin-top: 32px;
  }

  .archive-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .archive-title {
    font-weight: 700;
    font-size: 1rem;
  }

  .archive-hint {
    font-size: 0.74rem;
    color: var(--ink-soft);
  }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .archive-status {
    padding: 16px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .archive-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    transition: border-left-width 0.15s ease, background 0.15s ease;
  }

  .archive-item:hover,
  .archive-item:focus-visible {
    border-left-width: 6px;
    background: var(--bg-soft);
  }

  .archive-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .archive-name {
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .archive-size {
    flex: none;
    font-size: 0.74rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .footer {
    margin-top: 32px;
    font-size: 0.74rem;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="plate">
  <div class="header">
    <h1>잭슨사무실</h1>
    <span class="tag">Quick Links</span>
  </div>

  <div class="links">
    <a class="link-card" href="https://yamugyclaude.github.io/hanbadadiary/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">한바다</span>
        <span class="desc">hanbadadiary.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://yamugyclaude.github.io/JACKSONGUITAR/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">기타</span>
        <span class="desc">JACKSONGUITAR.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://yamugyclaude.github.io/jarvis-web/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">출퇴근기록</span>
        <span class="desc">jarvis-web.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://cloud-steel-delta.vercel.app/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">스케치업</span>
        <span class="desc">cloud-steel-delta.vercel.app</span>
      </span>
    </a>

  </div>

  <div class="archive">
    <div class="archive-head">
      <span class="archive-title">자료실</span>
      <span class="archive-hint">클릭하면 바로 다운로드됩니다</span>
    </div>
    <div class="archive-list" id="archive-list">
      <div class="archive-status">불러오는 중…</div>
    </div>
  </div>

  <div class="footer">클릭하면 새 탭에서 독립적으로 열립니다</div>
</div>

<script>
  const DRIVE_FOLDER_ID = '1m6THqz_7Y8VZ983gY2fWGQakm5Br18Ls';
  const DRIVE_API_KEY = 'AIzaSyDgBmawKbZCfYYNMoXg2eTtpbaWcR0uy2M';

  function formatSize(bytes) {
    if (!bytes) return '';
    const n = Number(bytes);
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function loadArchive() {
    const list = document.getElementById('archive-list');
    const url = `https://www.googleapis.com/drive/v3/files?q='${DRIVE_FOLDER_ID}'+in+parents+and+trashed=false&key=${DRIVE_API_KEY}&fields=files(id,name,size,mimeType)&orderBy=name`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('drive api error ' + res.status);
      const data = await res.json();
      const files = data.files || [];

      if (files.length === 0) {
        list.innerHTML = '<div class="archive-status">자료실이 비어 있습니다</div>';
        return;
      }

      list.innerHTML = '';
      files.forEach(file => {
        const isGoogleDoc = file.mimeType.startsWith('application/vnd.google-apps');
        const href = isGoogleDoc
          ? `https://drive.google.com/open?id=${file.id}`
          : `https://drive.google.com/uc?export=download&id=${file.id}`;

        const item = document.createElement('a');
        item.className = 'archive-item';
        item.href = href;
        if (!isGoogleDoc) item.setAttribute('download', file.name);
        item.innerHTML = `
          <span class="archive-name">${file.name}</span>
          <span class="archive-size">${formatSize(file.size)}</span>
        `;
        list.appendChild(item);
      });
    } catch (err) {
      list.innerHTML = '<div class="archive-status">목록을 불러오지 못했습니다</div>';
    }
  }

  loadArchive();
</script>

</body>
</html>
