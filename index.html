<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잭슨사무실</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #f4f0e8;
    --bg-soft: #ece5d6;
    --ink: #26221d;
    --ink-soft: #6b6255;
    --line: #ddd3bf;
    --card: #fdfbf6;
    --accent: #a86a2a;
    --accent-ink: #ffffff;
    --shadow: rgba(38, 34, 29, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1815;
      --bg-soft: #221e19;
      --ink: #ece5d6;
      --ink-soft: #a89a85;
      --line: #38322a;
      --card: #24201b;
      --accent: #d9a355;
      --accent-ink: #221a0d;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1815;
    --bg-soft: #221e19;
    --ink: #ece5d6;
    --ink-soft: #a89a85;
    --line: #38322a;
    --card: #24201b;
    --accent: #d9a355;
    --accent-ink: #221a0d;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .plate {
    width: 100%;
    max-width: 720px;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: clamp(2.1rem, 6vw, 3rem);
    margin: 0;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .header .tag {
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (max-width: 480px) {
    .links { grid-template-columns: 1fr; }
  }

  .link-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 20px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 1px 2px var(--shadow);
    transition: border-left-width 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    border-left-width: 6px;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }

  .link-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .link-text .name {
    font-weight: 700;
    font-size: 1.05rem;
  }

  .link-text .desc {
    font-size: 0.78rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .archive {
    margin-top: 32px;
  }

  .archive-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .archive-title {
    font-weight: 700;
    font-size: 1rem;
  }

  .archive-hint {
    font-size: 0.74rem;
    color: var(--ink-soft);
  }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.74rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .refresh-btn:hover,
  .refresh-btn:focus-visible {
    border-color: var(--accent);
    color: var(--ink);
  }

  .refresh-btn svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .archive-status {
    padding: 16px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .archive-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    transition: border-left-width 0.15s ease, background 0.15s ease;
  }

  .archive-item:hover,
  .archive-item:focus-visible {
    border-left-width: 6px;
    background: var(--bg-soft);
  }

  .archive-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .archive-name {
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .archive-size {
    flex: none;
    font-size: 0.74rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .footer {
    margin-top: 32px;
    font-size: 0.74rem;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="plate">
  <div class="header">
    <h1>잭슨사무실</h1>
    <span class="tag">Quick Links</span>
  </div>

  <div class="links">
    <a class="link-card" href="https://yamugyclaude.github.io/hanbadadiary/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">한바다</span>
        <span class="desc">hanbadadiary.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://yamugyclaude.github.io/JACKSONGUITAR/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">기타</span>
        <span class="desc">JACKSONGUITAR.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://yamugyclaude.github.io/jarvis-web/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">출퇴근기록</span>
        <span class="desc">jarvis-web.github.io</span>
      </span>
    </a>

    <a class="link-card" href="https://cloud-steel-delta.vercel.app/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">스케치업</span>
        <span class="desc">cloud-steel-delta.vercel.app</span>
      </span>
    </a>

    <a class="link-card" href="https://yamugyclaude.github.io/wing/" target="_blank" rel="noopener">
      <span class="link-text">
        <span class="name">윙</span>
        <span class="desc">wing.github.io</span>
      </span>
    </a>

  </div>

  <div class="archive">
    <div class="archive-head">
      <span class="archive-title">자료실</span>
      <button class="refresh-btn" onclick="location.reload()" aria-label="새로고침" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 5v6h-6"/></svg>
        새로고침
      </button>
      <span class="archive-hint">클릭하면 바로 다운로드됩니다</span>
    </div>
    <div class="archive-list">
      <a class="archive-item" href="https://drive.google.com/file/d/1p6gi5Hztyp1Ad2qk-4LczufeKvjSGhCN/view" target="_blank" rel="noopener">
        <span class="archive-name">office_utility_01.zip</span>
        <span class="archive-size">132.2 MB</span>
      </a>
    </div>
  </div>

  <div class="footer">클릭하면 새 탭에서 독립적으로 열립니다</div>
</div>

</body>
</html>
